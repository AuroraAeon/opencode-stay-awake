name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Behavioural tests
    # macOS is the primary platform (caffeinate). The suite skips itself on
    # hosts without a CLI sleep inhibitor, so Linux/Windows runners would be
    # no-ops rather than real coverage.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Syntax check
        run: node --check index.js

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Test suite
        run: npm test
