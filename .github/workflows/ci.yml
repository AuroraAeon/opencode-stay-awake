name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Behavioural tests
    # macOS is the primary platform (caffeinate). The suite skips itself on
    # hosts without a CLI sleep inhibitor, so Linux/Windows runners would be
    # no-ops rather than real coverage.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Syntax check
        run: node --check index.js

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Test suite
        run: npm test
